name: Repository-Wide Skill and Engine QA
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'engines/**'
      - 'scripts/audit_skill_parity.py'
      - '.github/workflows/skill-parity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural and skill-engine parity audit
        run: python scripts/audit_skill_parity.py --root . --out skill-parity-report.json
      - name: Publish machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-parity-report
          path: skill-parity-report.json
          if-no-files-found: warn
