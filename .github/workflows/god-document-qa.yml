name: God Document QA
on:
  push:
    paths:
      - 'skills/God/**'
      - '.github/workflows/god-document-qa.yml'
  pull_request:
    paths:
      - 'skills/God/**'
      - '.github/workflows/god-document-qa.yml'
permissions:
  contents: read
jobs:
  document-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document audit dependencies
        run: python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2"
      - name: Run two complete regression passes
        env:
          PYTHONPATH: skills/God/scripts
        run: |
          python -m unittest discover -s skills/God/tests -p 'test_*.py' -v
          python -m unittest discover -s skills/God/tests -p 'test_*.py' -v
      - name: Verify Python syntax
        run: python -m compileall -q skills/God/scripts skills/God/tests
