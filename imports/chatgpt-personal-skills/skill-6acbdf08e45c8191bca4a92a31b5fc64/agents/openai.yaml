interface:
  display_name: pepe
  short_description: Expand a remainder into an above-PhD embed prompt, code a promptform
    3D JavaScript widget that installs inside another web app, then run automatic
    QA and apply every fix. Support -geo execution-environment selection for agentic
    prompts. Use when the user types /pepe, asks for a drop-in promptform 3D web component,
    or wants prompt-then-code-then-QA for an embeddable panel.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
